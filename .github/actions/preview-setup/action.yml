name: Prepare isolated Preview
description: Install locked dependencies and initialize a job-local Supabase database.
runs:
  using: composite
  steps:
    - name: Use Node 24
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm
    - name: Install locked dependencies
      shell: bash
      run: npm ci
    - name: Apply reviewed dependency security patch
      shell: bash
      run: npm run security:patch-deps
    - name: Install Supabase CLI
      uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      with:
        version: 2.118.0
    - name: Start isolated preview database
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f supabase/config.toml ]; then
          supabase init
        fi
        supabase start
        supabase db reset
        supabase status -o env > /tmp/yas-supabase.env
        set -a
        source /tmp/yas-supabase.env
        set +a
        rm /tmp/yas-supabase.env
        PUBLIC_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
        SERVER_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
        test -n "${API_URL:-}"
        test -n "$PUBLIC_KEY"
        test -n "$SERVER_KEY"
        E2E_PASSWORD="$(openssl rand -base64 36 | tr -d '\n')"
        echo "::add-mask::$E2E_PASSWORD"
        echo "::add-mask::$SERVER_KEY"
        {
          echo "APP_URL=http://127.0.0.1:3000"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLIC_KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVER_KEY"
          echo "SUPABASE_PROTECTED_ASSETS_BUCKET=yas-protected-assets"
          echo "DATABASE_URL=$DB_URL"
          echo "APP_ENV=preview"
          echo "APP_VERSION=${{ github.sha }}"
          echo "CANONICAL_E2E=1"
          echo "CANONICAL_E2E_PASSWORD=$E2E_PASSWORD"
        } >> "$GITHUB_ENV"
