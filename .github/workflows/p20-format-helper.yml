name: P20 Page Formatter Helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-p20-page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Progress page and emit canonical bytes
        shell: bash
        run: |
          set -euo pipefail
          file="src/app/(protected)/(student)/progresso/page.tsx"
          npx prettier --write "$file"
          echo "P20_PAGE_FORMAT_BEGIN"
          base64 -w0 "$file"
          echo
          echo "P20_PAGE_FORMAT_END"
