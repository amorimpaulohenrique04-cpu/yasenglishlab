name: Stage 01 Full Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: stage-01-full-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  aliases:
    name: Mandatory aliases
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply reviewed dependency security patch
        run: npm run security:patch-deps
      - name: Canonicalize repository formatting in the implementation commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          npm run format
          if git diff --quiet; then
            echo "✓ repository formatting already canonical"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit --amend --no-edit
            git push --force-with-lease origin "HEAD:$HEAD_REF"
            echo "✓ amended canonical formatting into the implementation commit"
          fi
      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Fast mandatory aliases
        run: |
          npm run verify:agent
          npm run verify:security
          npm run verify:db
      - name: Start isolated database for verify:ui
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset
          supabase status -o env > /tmp/yas-supabase.env
          set -a
          source /tmp/yas-supabase.env
          set +a
          rm /tmp/yas-supabase.env
          PUBLIC_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          SERVER_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "${API_URL:-}"
          test -n "$PUBLIC_KEY"
          test -n "$SERVER_KEY"
          E2E_PASSWORD="$(openssl rand -base64 36 | tr -d '\n')"
          echo "::add-mask::$E2E_PASSWORD"
          echo "::add-mask::$SERVER_KEY"
          {
            echo "APP_URL=http://127.0.0.1:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLIC_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVER_KEY"
            echo "SUPABASE_PROTECTED_ASSETS_BUCKET=yas-protected-assets"
            echo "DATABASE_URL=$DB_URL"
            echo "APP_ENV=preview"
            echo "CANONICAL_E2E=1"
            echo "CANONICAL_E2E_PASSWORD=$E2E_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: UI alias
        run: npm run verify:ui
      - name: Remove generated verification artifacts before the full alias
        run: rm -f artifacts/a11y/results.json artifacts/golden/results.json
      - name: Stop UI database
        if: always()
        run: supabase stop --no-backup || true
      - name: Full alias
        run: npm run verify:full
