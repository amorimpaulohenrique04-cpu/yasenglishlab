name: Foundation Verify

on:
  push:
    branches:
      - harness/prompt-03
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply canonical formatting
        run: npm run format

      - name: Commit formatter output on harness branch
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: format harness files [skip ci]"
            git push
          fi

      - name: Verify foundation and harness
        run: npm run verify:agent

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify UI harness
        run: npm run verify:ui
