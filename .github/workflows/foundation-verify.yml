name: Official CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/teacher-sessions-redesign]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node 24
        id: node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Repository and lockfile policy
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node scripts/ci/check-repo-policy.mjs
      - name: Secret scan
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node scripts/ci/secret-scan.mjs
      - name: Install locked dependencies
        id: dependencies
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm ci
      - name: Apply reviewed dependency security patch
        id: patch
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run security:patch-deps
      - name: Verify reviewed dependency security patch
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: npm run verify:dependency-patches
      - name: Audit locked dependency graph
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: npm run verify:supply-chain

  quality:
    name: Quality
    needs: supply-chain
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply reviewed dependency security patch
        id: patch
        run: npm run security:patch-deps
      - name: Format
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: npm run format:check
      - name: Lint
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: npm run lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: npm run test:unit
      - name: Integration tests
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: npm run test:integration
      - name: Harness invariants
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: npm run verify:harness
      - name: Security invariants
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: npm run verify:security
      - name: Database structural invariants
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: npm run verify:db
      - name: Agent behavioral eval
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: npm run eval:agent
      - name: Production build
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: npm run build

  database:
    name: Database
    needs: supply-chain
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 54329
      PGUSER: postgres
      PGPASSWORD: postgres
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install PostgreSQL client
        id: client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Enforce migration policy
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        run: node scripts/ci/check-migrations.mjs
      - name: Validate migrations from a clean database
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        run: bash scripts/ci/validate-migrations.sh yas_clean_first
      - name: Replay migrations from a second clean database
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        run: bash scripts/ci/validate-migrations.sh yas_clean_replay
      - name: Validate base-to-head upgrade with legacy data
        if: ${{ !cancelled() && steps.client.outcome == 'success' }}
        run: bash scripts/ci/validate-upgrade.sh yas_upgrade

  guardrail-simulations:
    name: Guardrail Simulations
    needs: supply-chain
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 54329
      PGUSER: postgres
      PGPASSWORD: postgres
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply reviewed dependency security patch
        id: patch
        run: npm run security:patch-deps
      - name: Install PostgreSQL client
        id: client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Simulate valid PR
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: |
          node scripts/ci/check-repo-policy.mjs
          node scripts/ci/check-migrations.mjs
          node scripts/ci/secret-scan.mjs
      - name: Simulate failing test and prove it is rejected
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/unit/__ci_expected_failure.test.ts <<'EOF'
          import { expect, test } from "vitest";
          test("CI must reject a failing test", () => {
            expect(1).toBe(2);
          });
          EOF
          if npx vitest run tests/unit/__ci_expected_failure.test.ts; then
            echo "ERROR: an intentionally failing test passed."
            exit 1
          fi
          rm tests/unit/__ci_expected_failure.test.ts
          echo "✓ failing test was blocked"
      - name: Simulate invalid migration and prove it is rejected
        if: ${{ !cancelled() && steps.patch.outcome == 'success' && steps.client.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'this is intentionally invalid sql;' > supabase/migrations/99991231235959_ci_invalid.sql
          if bash scripts/ci/validate-migrations.sh yas_invalid_migration; then
            echo "ERROR: an invalid migration was accepted."
            exit 1
          fi
          rm supabase/migrations/99991231235959_ci_invalid.sql
          echo "✓ invalid migration was blocked"
      - name: Simulate detectable secret and prove it is rejected
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'ghp_%s\n' 'ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdef' > ci-secret-fixture.txt
          if node scripts/ci/secret-scan.mjs; then
            echo "ERROR: a detectable secret was accepted."
            exit 1
          fi
          rm ci-secret-fixture.txt
          echo "✓ detectable secret was blocked"

  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect whether runtime code changed
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Fail-closed: anything unexpected means "code changed" and the full Preview runs.
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "origin/$BASE_REF" HEAD)"
          if [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qvE '^(docs/.+|harness/.+\.(md|json)|(README|AGENTS|CLAUDE)\.md)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs/harness records changed; Preview suites are not required."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  preview-suite:
    env:
      YAS_E2E_PRODUCTION: "1"
    name: Preview (${{ matrix.suite }})
    needs: [changes, quality, database]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview
    strategy:
      fail-fast: false
      matrix:
        suite: [database-proofs, e2e, accessibility, visual, full-verification]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # verify:full runs eval:agent, which diffs against origin/main.
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare isolated Preview
        id: setup
        uses: ./.github/actions/preview-setup
      - name: Prove real database integration and booking concurrency
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.suite == 'database-proofs' }}
        run: npm run test:integration:db
      - name: Prove RLS permissions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.suite == 'database-proofs' }}
        run: npm run test:rls
      - name: Prove intentional error reaches observability
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.suite == 'database-proofs' }}
        env:
          OBSERVABILITY_LIVE_TEST: "1"
        run: npm run test:observability:live
      - name: Prepare canonical preview fixture
        id: fixture
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.suite != 'database-proofs' && matrix.suite != 'full-verification' }}
        run: node scripts/setup-canonical-e2e.mjs
      - name: Cache Playwright Chromium
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.suite != 'database-proofs' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        id: browser
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.suite != 'database-proofs' }}
        run: npx playwright install chromium
      - name: Build Preview app
        id: build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.suite != 'database-proofs' && matrix.suite != 'full-verification' && steps.fixture.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: npm run build
      - name: Critical E2E
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.build.outcome == 'success' && matrix.suite == 'e2e' }}
        run: npm run test:e2e -- --trace off
      - name: Reject skipped or retried-until-green E2E tests
        if: ${{ !cancelled() && matrix.suite == 'e2e' }}
        run: node scripts/ci/check-playwright-results.mjs artifacts/e2e/results.json "Critical E2E"
      - name: Assert persistence and analytics
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.build.outcome == 'success' && matrix.suite == 'e2e' }}
        run: node scripts/assert-canonical-e2e.mjs
      - name: Accessibility checks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.build.outcome == 'success' && matrix.suite == 'accessibility' }}
        run: npm run test:a11y -- --trace off
      - name: Reject skipped or retried-until-green accessibility tests
        if: ${{ !cancelled() && matrix.suite == 'accessibility' }}
        run: node scripts/ci/check-playwright-results.mjs artifacts/a11y/results.json "Accessibility checks"
      - name: Build Storybook
        id: storybook
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.suite == 'visual' }}
        run: npm run storybook:build
      - name: Design-system visual checks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.suite == 'visual' && steps.storybook.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: npm run test:visual:storybook -- --trace off
      - name: Validate Storybook results
        if: ${{ !cancelled() && matrix.suite == 'visual' }}
        run: node scripts/ci/check-playwright-results.mjs artifacts/storybook/results.json "Storybook"
      - name: Product golden visual checks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.build.outcome == 'success' && matrix.suite == 'visual' }}
        run: npm run test:visual:golden -- --trace off
      - name: Validate golden results
        if: ${{ !cancelled() && matrix.suite == 'visual' }}
        run: node scripts/ci/check-playwright-results.mjs artifacts/golden/results.json "Goldens"
      - name: Full release verification
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.browser.outcome == 'success' && matrix.suite == 'full-verification' }}
        run: npm run verify:full
      - name: Sanitize preview evidence
        id: sanitize
        if: always()
        run: node scripts/ci/redact-ci-evidence.mjs
      - name: Upload preview evidence
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-evidence-${{ matrix.suite }}-${{ github.sha }}
          path: |
            artifacts/e2e/
            artifacts/a11y/
            artifacts/golden/
            artifacts/storybook/
            test-results/**/*.png
            test-results/**/error-context.md
            test-results/**/attachments/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Stop isolated preview database
        if: always()
        run: supabase stop --no-backup || true

  preview:
    name: Preview
    needs: [changes, preview-suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout gate policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every Preview suite
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          SUITES: ${{ needs.preview-suite.result }}
        run: node scripts/ci/gate-results.mjs preview

  ci-gate:
    name: CI Gate
    if: always()
    needs: [supply-chain, quality, database, guardrail-simulations, preview]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gate policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every mandatory gate
        env:
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
          QUALITY: ${{ needs.quality.result }}
          DATABASE: ${{ needs.database.result }}
          SIMULATIONS: ${{ needs.guardrail-simulations.result }}
          PREVIEW: ${{ needs.preview.result }}
        run: node scripts/ci/gate-results.mjs
