name: Official CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Repository and lockfile policy
        run: node scripts/ci/check-repo-policy.mjs
      - name: Secret scan
        run: node scripts/ci/secret-scan.mjs
      - name: Audit locked dependency graph
        run: npm audit --audit-level=high

  quality:
    name: Quality
    needs: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Harness invariants
        run: npm run verify:harness
      - name: Security invariants
        run: npm run verify:security
      - name: Production build
        run: npm run build

  database:
    name: Database
    needs: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 54329
      PGUSER: postgres
      PGPASSWORD: postgres
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Enforce migration policy
        run: node scripts/ci/check-migrations.mjs
      - name: Validate migrations from a clean database
        run: bash scripts/ci/validate-migrations.sh yas_clean_first
      - name: Replay migrations from a second clean database
        run: bash scripts/ci/validate-migrations.sh yas_clean_replay
      - name: Validate base-to-head upgrade with legacy data
        run: bash scripts/ci/validate-upgrade.sh yas_upgrade

  guardrail-simulations:
    name: Guardrail Simulations
    needs: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 54329
      PGUSER: postgres
      PGPASSWORD: postgres
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Simulate valid PR
        run: |
          node scripts/ci/check-repo-policy.mjs
          node scripts/ci/check-migrations.mjs
          node scripts/ci/secret-scan.mjs
      - name: Simulate failing test and prove it is rejected
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/unit/__ci_expected_failure.test.ts <<'EOF'
          import { expect, test } from "vitest";
          test("CI must reject a failing test", () => {
            expect(1).toBe(2);
          });
          EOF
          if npx vitest run tests/unit/__ci_expected_failure.test.ts; then
            echo "ERROR: an intentionally failing test passed."
            exit 1
          fi
          rm tests/unit/__ci_expected_failure.test.ts
          echo "✓ failing test was blocked"
      - name: Simulate invalid migration and prove it is rejected
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'this is intentionally invalid sql;' > supabase/migrations/99991231235959_ci_invalid.sql
          if bash scripts/ci/validate-migrations.sh yas_invalid_migration; then
            echo "ERROR: an invalid migration was accepted."
            exit 1
          fi
          rm supabase/migrations/99991231235959_ci_invalid.sql
          echo "✓ invalid migration was blocked"
      - name: Simulate detectable secret and prove it is rejected
        shell: bash
        run: |
          set -euo pipefail
          printf 'ghp_%s\n' 'ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdef' > ci-secret-fixture.txt
          if node scripts/ci/secret-scan.mjs; then
            echo "ERROR: a detectable secret was accepted."
            exit 1
          fi
          rm ci-secret-fixture.txt
          echo "✓ detectable secret was blocked"

  preview:
    name: Preview
    needs: [quality, database]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: preview
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - name: Start isolated preview database
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          supabase start
          supabase db reset
          supabase status -o env > /tmp/yas-supabase.env
          set -a
          source /tmp/yas-supabase.env
          set +a
          rm /tmp/yas-supabase.env
          PUBLIC_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          SERVER_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "${API_URL:-}"
          test -n "$PUBLIC_KEY"
          test -n "$SERVER_KEY"
          E2E_PASSWORD="$(openssl rand -base64 36 | tr -d '\n')"
          echo "::add-mask::$E2E_PASSWORD"
          echo "::add-mask::$SERVER_KEY"
          {
            echo "APP_URL=http://127.0.0.1:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLIC_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVER_KEY"
            echo "SUPABASE_PROTECTED_ASSETS_BUCKET=yas-protected-assets"
            echo "DATABASE_URL=$DB_URL"
            echo "APP_ENV=preview"
            echo "APP_VERSION=${{ github.sha }}"
            echo "CANONICAL_E2E=1"
            echo "CANONICAL_E2E_PASSWORD=$E2E_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Prove real database integration and booking concurrency
        run: npm run test:integration:db
      - name: Prove RLS permissions
        run: npm run test:rls
      - name: Prove intentional error reaches observability
        env:
          OBSERVABILITY_LIVE_TEST: "1"
        run: npm run test:observability:live
      - name: Prepare canonical preview fixture
        run: node scripts/setup-canonical-e2e.mjs
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Critical E2E
        run: npm run test:e2e
      - name: Assert persistence and analytics
        run: node scripts/assert-canonical-e2e.mjs
      - name: Reset fixture for accessibility
        run: node scripts/setup-canonical-e2e.mjs
      - name: Accessibility checks
        run: npm run test:a11y
      - name: Build Storybook
        run: npm run storybook:build
      - name: Design-system visual checks
        run: npm run test:visual:storybook
      - name: Reset fixture for golden visual checks
        run: node scripts/setup-canonical-e2e.mjs
      - name: Product golden visual checks
        run: npm run test:visual:golden
      - name: Upload preview evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-evidence-${{ github.sha }}
          path: |
            artifacts/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop isolated preview database
        if: always()
        run: supabase stop --no-backup || true

  ci-gate:
    name: CI Gate
    if: always()
    needs: [supply-chain, quality, database, guardrail-simulations, preview]
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory gate
        env:
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
          QUALITY: ${{ needs.quality.result }}
          DATABASE: ${{ needs.database.result }}
          SIMULATIONS: ${{ needs.guardrail-simulations.result }}
          PREVIEW: ${{ needs.preview.result }}
        run: |
          test "$SUPPLY_CHAIN" = "success"
          test "$QUALITY" = "success"
          test "$DATABASE" = "success"
          test "$SIMULATIONS" = "success"
          test "$PREVIEW" = "success"
