name: Foundation Verify

on:
  push:
    branches:
      - main
      - design-system/prompt-04
      - domain-contracts/prompt-05
      - auth-rbac-rls/prompt-06
      - canonical-slice/prompt-07
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:

  format-prompt-07:
    runs-on: ubuntu-latest
    if: "github.event_name == 'push' && github.ref == 'refs/heads/canonical-slice/prompt-07' && contains(github.event.head_commit.message, 'style: apply prettier') == false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: canonical-slice/prompt-07

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply repository Prettier
        run: npm run format

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows/foundation-verify.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply prettier to prompt 07"
          git push
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify foundation and harness
        run: npm run verify:agent

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify UI harness
        run: npm run verify:ui

      - name: Upload design-system visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: design-system-visual-evidence
          path: test-results/
          if-no-files-found: warn

  database-contracts:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 54329
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Replay migrations, seed and invariants twice
        shell: bash
        run: |
          set -euo pipefail

          psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            create role anon nologin;
          exception when duplicate_object then
            null;
          end
          $$;

          do $$
          begin
            create role authenticated nologin;
          exception when duplicate_object then
            null;
          end
          $$;
          SQL

          apply_database() {
            local database="$1"
            createdb "$database"

            psql -d "$database" -v ON_ERROR_STOP=1 -c "create schema auth;"
            psql -d "$database" -v ON_ERROR_STOP=1 -c "create schema storage;"
            psql -d "$database" -v ON_ERROR_STOP=1 -c "create table auth.users (id uuid primary key, email text, raw_user_meta_data jsonb not null default '{}'::jsonb);"
            psql -d "$database" -v ON_ERROR_STOP=1 -c "create table storage.buckets (id text primary key, name text not null, public boolean not null default false, file_size_limit bigint, allowed_mime_types text[]);"
            psql -d "$database" -v ON_ERROR_STOP=1 -c "create function auth.uid() returns uuid language sql stable as 'select nullif(current_setting(''request.jwt.claim.sub'', true), '''')::uuid;';"
            psql -d "$database" -v ON_ERROR_STOP=1 -c "create function auth.jwt() returns jsonb language sql stable as 'select coalesce(nullif(current_setting(''request.jwt.claims'', true), '''')::jsonb, ''{}''::jsonb);';"

            for migration in supabase/migrations/*.sql; do
              psql -d "$database" -v ON_ERROR_STOP=1 -f "$migration"
            done

            psql -d "$database" -v ON_ERROR_STOP=1 -f supabase/seed.sql
            psql -d "$database" -v ON_ERROR_STOP=1 -f supabase/seed.sql

            for db_test in supabase/tests/*.sql; do
              psql -d "$database" -v ON_ERROR_STOP=1 -f "$db_test"
            done
          }

          apply_database yas_prompt07_first
          apply_database yas_prompt07_replay

  canonical-slice-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Start isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          supabase start
          supabase db reset

          supabase status -o env > /tmp/yas-supabase.env
          set -a
          source /tmp/yas-supabase.env
          set +a
          rm /tmp/yas-supabase.env

          PUBLIC_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          SERVER_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"

          test -n "${API_URL:-}"
          test -n "$PUBLIC_KEY"
          test -n "$SERVER_KEY"

          E2E_PASSWORD="$(openssl rand -base64 36 | tr -d '\n')"
          echo "::add-mask::$E2E_PASSWORD"
          echo "::add-mask::$SERVER_KEY"

          {
            echo "APP_URL=http://127.0.0.1:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLIC_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVER_KEY"
            echo "SUPABASE_PROTECTED_ASSETS_BUCKET=yas-protected-assets"
            echo "CANONICAL_E2E=1"
            echo "CANONICAL_E2E_PASSWORD=$E2E_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Prepare canonical student
        run: node scripts/setup-canonical-e2e.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run canonical browser flow
        run: npx playwright test tests/e2e/canonical-slice.spec.ts --project=chromium

      - name: Assert persistence and analytics
        run: node scripts/assert-canonical-e2e.mjs

      - name: Upload canonical visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canonical-slice-visual-evidence
          path: test-results/canonical-slice/
          if-no-files-found: warn

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
