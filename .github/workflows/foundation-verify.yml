name: Foundation Verify

on:
  push:
    branches:
      - design-system/prompt-04
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh locked dependencies
        run: npm install

      - name: Apply canonical formatting
        run: npm run format

      - name: Commit deterministic design-system artifacts
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain package-lock.json src .storybook tests scripts package.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json src .storybook tests scripts package.json
            git commit -m "chore: normalize design-system artifacts [skip ci]"
            git push
          fi

      - name: Verify foundation and harness
        run: npm run verify:agent

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify UI harness
        run: npm run verify:ui

      - name: Upload design-system visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-system-visual-evidence
          path: test-results/
          if-no-files-found: warn
