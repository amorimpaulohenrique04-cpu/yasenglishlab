name: Foundation Verify

on:
  push:
    branches:
      - foundation/prompt-02
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh locked dependencies
        run: npm install

      - name: Apply canonical formatting
        run: npm run format

      - name: Commit deterministic foundation artifacts
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: refresh foundation artifacts [skip ci]"
            git push
          fi

      - name: Verify foundation
        run: npm run verify

      - name: Build Storybook
        run: npm run storybook:build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e
