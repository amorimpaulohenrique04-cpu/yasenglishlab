name: P20 Format Harness Progress Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-harness-progress:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write harness/agent-state/progress.md
          git rm .github/workflows/p20-format-harness-progress-once.yml
          git config user.name "yas-ci"
          git config user.email "yas-ci@users.noreply.github.com"
          git add harness/agent-state/progress.md
          git commit -m "style(p20): format verification hardening evidence"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
