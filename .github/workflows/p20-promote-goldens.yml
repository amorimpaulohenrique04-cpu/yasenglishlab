name: P20 Promote Inspected Golden Baselines

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  promote-progress-goldens:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Promote exact inspected run-337 Progress screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="11197828922"
          rm -rf /tmp/p20-golden-artifact
          mkdir -p /tmp/p20-golden-artifact
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o /tmp/p20-golden.zip
          unzip -q /tmp/p20-golden.zip -d /tmp/p20-golden-artifact

          mkdir -p \
            tests/visual/goldens/desktop \
            tests/visual/goldens/tablet \
            tests/visual/goldens/mobile

          cp "/tmp/p20-golden-artifact/test-results/golden-login-home-and-aulas-match-golden-baselines-desktop/progresso-actual.png" \
            tests/visual/goldens/desktop/progresso-linux.png
          cp "/tmp/p20-golden-artifact/test-results/golden-login-home-and-aulas-match-golden-baselines-tablet/progresso-actual.png" \
            tests/visual/goldens/tablet/progresso-linux.png
          cp "/tmp/p20-golden-artifact/test-results/golden-login-home-and-aulas-match-golden-baselines-mobile/progresso-actual.png" \
            tests/visual/goldens/mobile/progresso-linux.png

          git config user.name "yas-ci"
          git config user.email "yas-ci@users.noreply.github.com"
          git add \
            tests/visual/goldens/desktop/progresso-linux.png \
            tests/visual/goldens/tablet/progresso-linux.png \
            tests/visual/goldens/mobile/progresso-linux.png
          if git diff --cached --quiet; then
            echo "Inspected Progress baselines are already present."
            exit 0
          fi
          git commit -m "test(p20): add inspected Progress golden baselines"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
