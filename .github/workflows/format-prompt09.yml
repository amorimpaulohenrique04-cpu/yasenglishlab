name: Prompt 09 Formatter

on:
  push:
    branches:
      - cicd/prompt-09

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style: apply prompt 09 prettier')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cicd/prompt-09
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Deterministic install
        run: npm ci

      - name: Apply repository Prettier
        run: npm run format

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply prompt 09 prettier"
          git push
