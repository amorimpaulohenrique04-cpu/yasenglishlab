name: P21 Format Discovery

on:
  push:
    branches:
      - verify/p21-home-projection-7874043c
    paths:
      - .github/workflows/p21-format-discovery.yml

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format target files
        run: npx prettier --write harness/agent-state/progress.md harness/feature_list.json src/server/schedule/supabase-schedule-repository.ts
      - name: Upload canonical formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p21-canonical-format
          path: |
            harness/agent-state/progress.md
            harness/feature_list.json
            src/server/schedule/supabase-schedule-repository.ts
          retention-days: 1
