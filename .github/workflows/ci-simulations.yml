name: Yas CI Simulations

on:
  push:
    branches:
      - cicd/prompt-09
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valid_pr:
    name: Simulation / Valid PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Deterministic install
        run: npm ci

      - name: Valid change passes supply-chain and engineering gates
        run: |
          npm run ci:supply-chain
          npm run ci:migrations
          npm run verify:agent

  failing_test:
    name: Simulation / Failing Test Blocked
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Deterministic install
        run: npm ci

      - name: Prove a failing test returns non-zero
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/unit/__ci_deliberate_failure.test.ts <<'EOF'
          import { expect, test } from "vitest";
          test("CI blocks a regression", () => {
            expect("blocked").toBe("allowed");
          });
          EOF

          set +e
          npm run test:unit
          STATUS=$?
          set -e
          rm tests/unit/__ci_deliberate_failure.test.ts

          if [ "$STATUS" -eq 0 ]; then
            echo "Failing test unexpectedly passed."
            exit 1
          fi
          echo "✓ Failing test was blocked with exit code $STATUS."

  invalid_migration:
    name: Simulation / Invalid Migration Blocked
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 54329
      PGUSER: postgres
      PGPASSWORD: postgres
      RUN_DB_TESTS: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prove malformed migration breaks clean replay
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'this is deliberately invalid sql;' > supabase/migrations/99999999999999_ci_invalid.sql

          set +e
          bash scripts/ci/replay-database.sh yas_invalid_migration
          STATUS=$?
          set -e
          rm supabase/migrations/99999999999999_ci_invalid.sql

          if [ "$STATUS" -eq 0 ]; then
            echo "Invalid migration unexpectedly replayed."
            exit 1
          fi
          echo "✓ Invalid migration was blocked with exit code $STATUS."

  detectable_secret:
    name: Simulation / Detectable Secret Blocked
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Prove detectable secret returns non-zero
        shell: bash
        run: |
          set -euo pipefail
          printf 'ghp_%s\n' "$(printf 'A%.0s' {1..32})" > ci-secret-fixture.txt

          set +e
          npm run ci:secrets
          STATUS=$?
          set -e
          rm ci-secret-fixture.txt

          if [ "$STATUS" -eq 0 ]; then
            echo "Detectable secret unexpectedly passed."
            exit 1
          fi
          echo "✓ Detectable secret was blocked with exit code $STATUS."
