name: Yas Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character main commit SHA to release
        required: true
        type: string
      release_gate:
        description: Type APPROVE after reviewing the release
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  release_gate:
    name: Release Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Verify main ancestry, green CI and reviewed PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_GATE: ${{ inputs.release_gate }}
        run: npm run ci:release-gate -- --sha "$RELEASE_SHA" --gate "$RELEASE_GATE"

  release_production:
    name: Release Production
    needs:
      - release_gate
    if: vars.YAS_PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    env:
      YAS_ENVIRONMENT: production
      RELEASE_SHA: ${{ inputs.release_sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout approved release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Deterministic install
        run: npm ci

      - name: Re-run supply-chain gate at release boundary
        run: npm run ci:supply-chain

      - name: Install Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.118.0

      - name: Validate production-only credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$YAS_ENVIRONMENT" = "production"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Link production database
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Dry-run production migrations
        run: supabase db push --dry-run

      - name: Apply reviewed migrations to production
        run: supabase db push

      - name: Confirm production migration history
        run: supabase migration list

      - name: Pull dedicated production project settings
        run: npx --yes vercel@59.20.0 pull --yes --environment=production --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

      - name: Build production artifact
        run: npx --yes vercel@59.20.0 build --yes --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

      - name: Deploy production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@59.20.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID" | tail -n 1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployed to $URL"
