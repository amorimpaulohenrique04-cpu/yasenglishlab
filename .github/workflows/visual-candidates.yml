name: Visual baseline candidates
# Temporary PR-74 evidence producer. It never replaces the required comparison gate.
on:
  pull_request:
    branches: [main]
    paths: ["tests/visual/golden.spec.ts"]
permissions:
  contents: read
jobs:
  candidates:
    if: github.event.pull_request.number == 74
    env:
      YAS_E2E_PRODUCTION: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/preview-setup
      - run: node scripts/setup-canonical-e2e.mjs
      - run: npx playwright install chromium
      - run: npm run build
      - name: Render candidates for review
        run: npm run test:visual:update
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-baseline-candidates
          path: tests/visual/goldens/
      - run: supabase stop --no-backup
        if: always()
