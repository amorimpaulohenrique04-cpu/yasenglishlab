name: P20 Verify Full Candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-full:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout verified P20 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5f4ea8ccdad9cb394ba17d55b39fc60bc464d024
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.118.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Verify full exactly
        run: npm run verify:full
