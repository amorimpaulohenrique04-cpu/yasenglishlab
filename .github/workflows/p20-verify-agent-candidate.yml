name: P20 Verify Agent Candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5f4ea8ccdad9cb394ba17d55b39fc60bc464d024
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:agent
