name: P20 Format Progress E2E Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-progress-e2e:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write tests/e2e/progress.spec.ts
          git rm .github/workflows/p20-format-progress-e2e-once.yml
          git config user.name "yas-ci"
          git config user.email "yas-ci@users.noreply.github.com"
          git add tests/e2e/progress.spec.ts
          git commit -m "style(p20): apply canonical Progress E2E formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
