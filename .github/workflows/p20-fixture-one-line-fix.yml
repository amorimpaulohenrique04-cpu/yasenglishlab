name: P20 Fixture One-Line Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-progress-fixture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply only the Progress fixture status correction
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = "scripts/setup-canonical-e2e.mjs";
          const source = fs.readFileSync(path, "utf8");
          const before = '    status: "COMPLETED",\n  },\n  {\n    id: teacherOpsSessionId,';
          const after = '    status: "SCHEDULED",\n  },\n  {\n    id: teacherOpsSessionId,';
          if (!source.includes(before)) {
            console.log("Progress fixture is already corrected; no write needed.");
            process.exit(0);
          }
          fs.writeFileSync(path, source.replace(before, after));
          NODE
          git config user.name "yas-ci"
          git config user.email "yas-ci@users.noreply.github.com"
          git add scripts/setup-canonical-e2e.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(p20): keep progress fixture bookable"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
