name: P21 Temporary Formatter

on:
  push:
    branches:
      - feat/p21-home-projection-v1
    paths:
      - .github/workflows/p21-temporary-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P21 branch
        uses: actions/checkout@v4
        with:
          ref: feat/p21-home-projection-v1

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format remaining P21 files
        run: |
          npx prettier --write             "src/modules/home/application/queries.ts"             "src/modules/home/domain/models.ts"             "tests/e2e/canonical-slice.spec.ts"             "tests/integration/home-application.test.ts"             "tests/unit/home-projection.test.ts"

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             "src/modules/home/application/queries.ts"             "src/modules/home/domain/models.ts"             "tests/e2e/canonical-slice.spec.ts"             "tests/integration/home-application.test.ts"             "tests/unit/home-projection.test.ts"
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style(p21): apply canonical Prettier output"
            git push origin HEAD:feat/p21-home-projection-v1
          fi
