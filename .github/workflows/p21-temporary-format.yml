name: P21 Temporary Formatter

on:
  push:
    branches:
      - feat/p21-home-projection-v1
    paths:
      - .github/workflows/p21-temporary-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P21 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/p21-home-projection-v1

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format P21 aggregate verifier
        run: npx prettier --write ".github/workflows/foundation-verify.yml"

      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".github/workflows/foundation-verify.yml"
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style(p21): format aggregate verifier"
            git push origin HEAD:feat/p21-home-projection-v1
          fi
